name: Build STREAM Static Binaries
jobs:
  build:
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          target: linux-amd64
          goos: linux
          goarch: amd64
          cc: gcc
          cflags: -O3 -static -fno-stack-protector -Wl,--gc-sections -march=x86-64 -mtune=generic
          fflags: -O3 -static -fno-stack-protector
        - os: ubuntu-latest
          target: linux-amd64-compat
          goos: linux
          goarch: amd64
          cc: gcc
          cflags: -O2 -march=x86-64 -mtune=generic -static -fno-stack-protector -mno-sse4.2 -mno-avx -mno-avx2
          fflags: -O2 -static -fno-stack-protector
        - os: ubuntu-latest
          target: linux-386
          goos: linux
          goarch: 386
          cc: gcc
          cflags: -m32 -static -O2 -march=i686 -mtune=generic -fno-stack-protector
          fflags: -m32 -O2 -static -fno-stack-protector
          packages: gcc-multilib gfortran-multilib
        - os: ubuntu-latest
          target: linux-arm64
          goos: linux
          goarch: arm64
          cc: aarch64-linux-gnu-gcc
          fc: aarch64-linux-gnu-gfortran
          cflags: -static -O3 -fno-stack-protector -march=armv8-a
          fflags: -static -O3 -fno-stack-protector
          packages: gcc-aarch64-linux-gnu gfortran-aarch64-linux-gnu
          strip: aarch64-linux-gnu-strip
        - os: ubuntu-latest
          target: linux-armv7
          goos: linux
          goarch: arm
          goarm: '7'
          cc: arm-linux-gnueabihf-gcc
          fc: arm-linux-gnueabihf-gfortran
          cflags: -static -O2 -march=armv7-a -mfpu=vfpv3-d16 -fno-stack-protector
          fflags: -static -O2 -fno-stack-protector
          packages: gcc-arm-linux-gnueabihf gfortran-arm-linux-gnueabihf
          strip: arm-linux-gnueabihf-strip
        - os: ubuntu-latest
          target: linux-armv6
          goos: linux
          goarch: arm
          goarm: '6'
          cc: arm-linux-gnueabi-gcc
          fc: arm-linux-gnueabi-gfortran
          cflags: -static -O2 -march=armv6 -marm -mfloat-abi=soft -fno-stack-protector
          fflags: -static -O2 -march=armv6 -marm -mfloat-abi=soft -fno-stack-protector
          packages: gcc-arm-linux-gnueabi gfortran-arm-linux-gnueabi
          strip: arm-linux-gnueabi-strip
        - os: ubuntu-latest
          target: linux-riscv64
          goos: linux
          goarch: riscv64
          cc: riscv64-linux-gnu-gcc
          fc: riscv64-linux-gnu-gfortran
          cflags: -static -O2 -fno-stack-protector
          fflags: -static -O2 -fno-stack-protector
          packages: gcc-riscv64-linux-gnu gfortran-riscv64-linux-gnu
          strip: riscv64-linux-gnu-strip
        - os: ubuntu-latest
          target: linux-ppc64le
          goos: linux
          goarch: ppc64le
          cc: powerpc64le-linux-gnu-gcc
          fc: powerpc64le-linux-gnu-gfortran
          cflags: -static -O2 -fno-stack-protector
          fflags: -static -O2 -fno-stack-protector
          packages: gcc-powerpc64le-linux-gnu gfortran-powerpc64le-linux-gnu
          strip: powerpc64le-linux-gnu-strip
        - os: ubuntu-latest
          target: linux-ppc64
          goos: linux
          goarch: ppc64
          cc: powerpc64-linux-gnu-gcc
          fc: powerpc64-linux-gnu-gfortran
          cflags: -static -O2 -fno-stack-protector
          fflags: -static -O2 -fno-stack-protector
          packages: gcc-powerpc64-linux-gnu gfortran-powerpc64-linux-gnu
          strip: powerpc64-linux-gnu-strip
        - os: ubuntu-latest
          target: linux-s390x
          goos: linux
          goarch: s390x
          cc: s390x-linux-gnu-gcc
          fc: s390x-linux-gnu-gfortran
          cflags: -static -O2 -fno-stack-protector
          fflags: -static -O2 -fno-stack-protector
          packages: gcc-s390x-linux-gnu gfortran-s390x-linux-gnu
          strip: s390x-linux-gnu-strip
        - os: ubuntu-latest
          target: linux-mips
          goos: linux
          goarch: mips
          cc: mips-linux-gnu-gcc
          fc: mips-linux-gnu-gfortran
          cflags: -static -O2 -fno-stack-protector -mabi=32
          fflags: -static -O2 -fno-stack-protector
          packages: gcc-mips-linux-gnu gfortran-mips-linux-gnu
          strip: mips-linux-gnu-strip
          use_buildx: true
        - os: ubuntu-latest
          target: linux-mipsle
          goos: linux
          goarch: mipsle
          cc: mipsel-linux-gnu-gcc
          fc: mipsel-linux-gnu-gfortran
          cflags: -static -O2 -fno-stack-protector -mabi=32
          fflags: -static -O2 -fno-stack-protector
          packages: gcc-mipsel-linux-gnu gfortran-mipsel-linux-gnu
          strip: mipsel-linux-gnu-strip
          use_buildx: true
        - os: ubuntu-latest
          target: linux-mips64
          goos: linux
          goarch: mips64
          cc: mips64-linux-gnuabi64-gcc
          fc: mips64-linux-gnuabi64-gfortran
          cflags: -static -O2 -fno-stack-protector -mabi=64
          fflags: -static -O2 -fno-stack-protector
          packages: gcc-mips64-linux-gnuabi64 gfortran-mips64-linux-gnuabi64
          strip: mips64-linux-gnuabi64-strip
          use_buildx: true
        - os: ubuntu-latest
          target: linux-mips64le
          goos: linux
          goarch: mips64le
          cc: mips64el-linux-gnuabi64-gcc
          fc: mips64el-linux-gnuabi64-gfortran
          cflags: -static -O2 -fno-stack-protector -mabi=64
          fflags: -static -O2 -fno-stack-protector
          packages: gcc-mips64el-linux-gnuabi64 gfortran-mips64el-linux-gnuabi64
          strip: mips64el-linux-gnuabi64-strip
          use_buildx: true
        - os: macos-latest
          target: darwin-amd64
          goos: darwin
          goarch: amd64
          cc: clang
          fc: gfortran
          cflags: -O3 -arch x86_64 -mmacosx-version-min=10.12
          fflags: -O3 -mmacosx-version-min=10.12 -fopenmp
          setup_fortran: true
          use_openmp: true
        - os: macos-latest
          target: darwin-arm64
          goos: darwin
          goarch: arm64
          cc: clang
          fc: gfortran
          cflags: -O3 -arch arm64 -mmacosx-version-min=11.0
          fflags: -O3 -mmacosx-version-min=11.0 -fopenmp
          setup_fortran: true
          use_openmp: true
        - os: ubuntu-latest
          target: windows-amd64
          goos: windows
          goarch: amd64
          cc: x86_64-w64-mingw32-gcc
          fc: x86_64-w64-mingw32-gfortran
          cflags: -O3 -static -static-libgcc -static-libstdc++ -static-libgfortran
          fflags: -O3 -static -static-libgcc -static-libgfortran
          packages: gcc-mingw-w64-x86-64 gfortran-mingw-w64-x86-64
          strip: x86_64-w64-mingw32-strip
          ext: .exe
        - os: ubuntu-latest
          target: windows-386
          goos: windows
          goarch: 386
          cc: i686-w64-mingw32-gcc
          fc: i686-w64-mingw32-gfortran
          cflags: -O3 -static -static-libgcc -static-libstdc++ -static-libgfortran
          fflags: -O3 -static -static-libgcc -static-libgfortran
          packages: gcc-mingw-w64-i686 gfortran-mingw-w64-i686
          strip: i686-w64-mingw32-strip
          ext: .exe
        - os: ubuntu-latest
          target: windows-arm64
          goos: windows
          goarch: arm64
          cc: aarch64-w64-mingw32-clang
          fc: aarch64-w64-mingw32-gfortran
          cflags: -O3 -static
          fflags: -O3 -static
          ext: .exe
          use_llvm_mingw: true
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/stream/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
    - name: Checkout current repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Checkout STREAM source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: jeffhammond/STREAM
        path: stream-src
    - name: Create bin directory
      run: mkdir -p bin
    - name: Setup QEMU and Docker Buildx (for exotic architectures)
      if: matrix.use_buildx == true
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: all
    - name: Setup build environment (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gfortran
        if [[ -n "${{ matrix.packages }}" ]]; then
          sudo apt-get install -y ${{ matrix.packages }}
        fi
    - name: Setup LLVM-MinGW for Windows ARM64
      if: matrix.use_llvm_mingw == true
      run: |
        set -euo pipefail
        source "$RUNNER_TEMP/ci-network.sh"
        curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest > llvm-mingw-release.json
        url=$(jq -er '[.assets[] | select(.name | test("^llvm-mingw-.*-ucrt-ubuntu-.*-x86_64\\.tar\\.xz$")) | .browser_download_url] | first // empty' llvm-mingw-release.json)
        [[ "$url" == https://github.com/mstorsjo/llvm-mingw/releases/download/* ]]
        curl -fL "$url" -o llvm-mingw.tar.xz
        tar -xf llvm-mingw.tar.xz
        shopt -s nullglob
        directories=(llvm-mingw-*/)
        [[ ${#directories[@]} == 1 ]]
        sudo mv "${directories[0]}" /opt/llvm-mingw
        [[ -x /opt/llvm-mingw/bin/aarch64-w64-mingw32-clang ]]
        echo /opt/llvm-mingw/bin >> "$GITHUB_PATH"
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Setup build environment (macOS)
      if: runner.os == 'macOS'
      run: |
        # 安装 gfortran 和 OpenMP (如果需要)
        if [[ "${{ matrix.setup_fortran }}" == "true" ]]; then
          # 安装 GCC (包含 gfortran)
          brew install gcc
          # 安装 libomp 用于 OpenMP 支持
          if [[ "${{ matrix.use_openmp }}" == "true" ]]; then
            brew install libomp
          fi
        fi
    - name: Build STREAM static binary
      run: |
        set -euo pipefail
        cd stream-src
        CC="${{ matrix.cc }}"
        FC="${{ matrix.fc || matrix.cc }}"
        read -r -a flags <<< "${{ matrix.cflags }}"
        read -r -a fflags <<< "${{ matrix.fflags || matrix.cflags }}"
        extra=()
        if [[ "${{ matrix.use_openmp }}" == true ]]; then
          extra=(-Xpreprocessor -fopenmp -I"$(brew --prefix libomp)/include" -L"$(brew --prefix libomp)/lib" -lomp)
        fi
        # Both attempts retain the architecture, ABI and static-link flags.
        if ! "$CC" "${flags[@]}" "${extra[@]}" -DSTREAM_ARRAY_SIZE=10000000 -DNTIMES=10 stream.c -o stream_c; then
          rm -f stream_c
          "$CC" "${flags[@]}" -O2 -DSTREAM_ARRAY_SIZE=10000000 -DNTIMES=10 stream.c -o stream_c
        fi
        [[ -s stream_c ]]
        mkdir -p ../build-output
        prefix="stream-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && 'v' }}${{ matrix.goarm }}"
        if [[ "${{ matrix.target }}" == linux-amd64-compat ]]; then prefix=stream-linux-amd64-compat; fi
        cp stream_c "../build-output/$prefix${{ matrix.ext }}"
        cp stream_c "../build-output/${prefix}_c${{ matrix.ext }}"
        # Optional Fortran binaries are published only when their own compiler and architecture are valid.
        if [[ "${{ matrix.goos }}" == darwin && "${{ matrix.goarch }}" == amd64 && "${{ runner.arch }}" == ARM64 ]]; then
          echo "Fortran cross compiler unavailable; the previously published Fortran binary is retained."
        elif command -v "$FC" >/dev/null; then
          if "$FC" "${fflags[@]}" stream.f -o stream_f; then
            cp stream_f "../build-output/${prefix}_f${{ matrix.ext }}"
          else
            echo "::warning::Optional Fortran build unavailable; the previous validated binary is retained."
            rm -f stream_f
          fi
        fi
        if [[ "${{ matrix.target }}" == linux-amd64 || ("${{ matrix.goos }}" == darwin && "${{ matrix.goarch }}" == arm64 && "${{ runner.arch }}" == ARM64) ]]; then
          "$CC" "${flags[@]}" -DSTREAM_ARRAY_SIZE=65536 -DNTIMES=2 stream.c -o stream-smoke
          ./stream-smoke > stream-smoke.txt
          grep -F "Solution Validates" stream-smoke.txt
        fi
      shell: bash
    - name: Verify all new binary architectures and static linkage
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=(build-output/stream-*)
        [[ ${#files[@]} -ge 2 ]]
        for file in "${files[@]}"; do
          [[ -f "$file" && -s "$file" ]]
          if [[ "${{ matrix.goos }}" == linux ]]; then
            header=$(readelf -h "$file")
            case "${{ matrix.goarch }}" in
              amd64) machine=X86-64; class=ELF64; endian='little endian' ;;
              386) machine=80386; class=ELF32; endian='little endian' ;;
              arm64) machine=AArch64; class=ELF64; endian='little endian' ;;
              arm) machine=ARM; class=ELF32; endian='little endian' ;;
              riscv64) machine=RISC-V; class=ELF64; endian='little endian' ;;
              ppc64) machine=PowerPC64; class=ELF64; endian='big endian' ;;
              ppc64le) machine=PowerPC64; class=ELF64; endian='little endian' ;;
              s390x) machine='IBM S/390'; class=ELF64; endian='big endian' ;;
              mips) machine=MIPS; class=ELF32; endian='big endian' ;;
              mipsle) machine=MIPS; class=ELF32; endian='little endian' ;;
              mips64) machine=MIPS; class=ELF64; endian='big endian' ;;
              mips64le) machine=MIPS; class=ELF64; endian='little endian' ;;
              *) exit 1 ;;
            esac
            grep -F "$machine" <<< "$header"
            grep -F "$class" <<< "$header"
            grep -F "$endian" <<< "$header"
            readelf -l "$file" > binary-segments.txt
            if grep -q INTERP binary-segments.txt; then echo "Binary retained a dynamic loader." >&2; exit 1; fi
            if [[ "${{ matrix.target }}" == linux-armv6 ]]; then
              attributes=$(readelf -A "$file")
              grep -Eq 'Tag_CPU_arch: v(4|5|6)([^0-9]|$)' <<< "$attributes"
              if grep -Eq 'Tag_CPU_arch: v(7|8|9)' <<< "$attributes"; then exit 1; fi
            fi
          elif [[ "${{ matrix.goos }}" == darwin ]]; then
            lipo "$file" -verify_arch "${{ matrix.goarch == 'amd64' && 'x86_64' || 'arm64' }}"
          elif [[ "${{ matrix.goos }}" == windows ]]; then
            info=$(file "$file")
            case "${{ matrix.goarch }}" in
              amd64) grep -Ei 'PE32[+].*x86-64' <<< "$info" ;;
              386) grep -Ei 'PE32 executable.*Intel 80386' <<< "$info" ;;
              arm64) grep -Ei 'PE32[+].*Aarch64' <<< "$info" ;;
              *) exit 1 ;;
            esac
          fi
        done
    - name: Upload binary artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: stream-${{ matrix.target }}
        path: build-output/stream-*
        retention-days: 30
        if-no-files-found: error
  collect:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'
    steps:
    - name: Checkout current repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    - name: Checkout STREAM source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: jeffhammond/STREAM
        path: stream-src
    - name: Download all artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: artifacts/
    - name: Organize binaries
      run: |
        # 创建 bin 目录
        mkdir -p bin/

        # 从所有构建工件中复制文件到 bin 目录
        find artifacts/ -type f -name "stream-*" -exec cp {} bin/ \;

        # 复制失败标记文件（如果有的话）


        # 给所有二进制文件添加执行权限
        chmod +x bin/stream-* 2>/dev/null || true

        # 创建 README 文件
        cat > bin/README.md << 'EOF'
        # STREAM Static Binaries

        This directory contains statically compiled binaries of [STREAM](https://github.com/jeffhammond/STREAM) memory bandwidth benchmark for various platforms and architectures.

        ## About STREAM

        The STREAM benchmark is a simple synthetic benchmark program that measures sustainable memory bandwidth (in MB/s) and the corresponding computation rate for simple vector kernels.

        ## Available Binaries

        ### Linux (Complete Architecture Support)
        - `stream-linux-amd64` - Linux x86_64 (optimized)
        - `stream-linux-amd64-compat` - Linux x86_64 (maximum compatibility)
        - `stream-linux-386` - Linux x86 (32-bit)
        - `stream-linux-arm64` - Linux ARM64 (ARMv8)
        - `stream-linux-armv7` - Linux ARMv7
        - `stream-linux-armv6` - Linux ARMv6
        - `stream-linux-riscv64` - Linux RISC-V 64-bit
        - `stream-linux-ppc64le` - Linux PowerPC64 (little-endian)
        - `stream-linux-ppc64` - Linux PowerPC64 (big-endian)
        - `stream-linux-s390x` - Linux IBM System z (s390x)
        - `stream-linux-mips` - Linux MIPS (32-bit, big-endian)
        - `stream-linux-mipsle` - Linux MIPS (32-bit, little-endian)
        - `stream-linux-mips64` - Linux MIPS64 (big-endian)
        - `stream-linux-mips64le` - Linux MIPS64 (little-endian)

        ### macOS
        - `stream-darwin-amd64` - macOS x86_64 (macOS 10.12+)
        - `stream-darwin-arm64` - macOS ARM64 (Apple Silicon, macOS 11.0+)

        ### Windows
        - `stream-windows-amd64.exe` - Windows x86_64
        - `stream-windows-386.exe` - Windows x86 (32-bit)
        - `stream-windows-arm64.exe` - Windows ARM64

        ## Binary Variants

        Some platforms may include both C and Fortran versions:
        - `stream-*_c` - C version
        - `stream-*_f` - Fortran version (if available)
        - `stream-*` - Default version (usually C)

        ## Compatibility Notes

        - **Linux binaries**: Statically linked for maximum portability (no dependencies required)
        - **Linux amd64-compat**: Built without advanced CPU instructions for older processors
        - **Exotic architectures** (MIPS, s390x, etc.): May have reduced optimization due to cross-compilation constraints
        - **Windows binaries**: Statically linked, no additional runtime dependencies required
        - **macOS binaries**: Dynamically linked with OpenMP support for better performance

        ## Usage

        ### Linux/macOS
        ```bash
        # Make executable (if needed)
        chmod +x stream-linux-amd64

        # Run memory bandwidth benchmark
        ./stream-linux-amd64
        ```

        ### Windows
        ```cmd
        # Run memory bandwidth benchmark
        stream-windows-amd64.exe
        ```

        ## Understanding STREAM Results

        STREAM measures four different vector operations:
        - **Copy**: `a[i] = b[i]`
        - **Scale**: `a[i] = q*b[i]`
        - **Add**: `a[i] = b[i] + c[i]`
        - **Triad**: `a[i] = b[i] + q*c[i]`

        The results show the sustainable memory bandwidth in MB/s for each operation.

        ## Build Information

        These binaries are automatically built using GitHub Actions from the [STREAM source repository](https://github.com/jeffhammond/STREAM).
        All binaries are optimized for their respective platforms with fallback compilation strategies for exotic architectures.

        **Cross-compilation toolchains used:**
        - GNU GCC cross-compilers for most Linux architectures
        - LLVM-MinGW for Windows ARM64
        - Native Clang/GCC for macOS
        - QEMU emulation for MIPS architectures during build
        EOF

        echo "Successfully organized binaries:"
        ls -la bin/

        # 生成校验和
        cd bin
        sha256sum stream-* > SHA256SUMS
    - name: Configure Git for automated commits
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    - name: Commit and push binaries to repository
      run: |
        # 计算统计数据
        total_binaries=$(ls bin/stream-* 2>/dev/null | grep -v -E '\.(md|txt)' | grep -v "FAILED" | wc -l)
        linux_count=$(ls bin/stream-linux-* 2>/dev/null | grep -v "FAILED" | wc -l)
        darwin_count=$(ls bin/stream-darwin-* 2>/dev/null | grep -v "FAILED" | wc -l)
        windows_count=$(ls bin/stream-windows-* 2>/dev/null | grep -v "FAILED" | wc -l)

        # 检查是否有变化
        if [[ $(git status --porcelain bin/) ]]; then
          echo "Changes detected in bin/ directory, committing..."
          git add bin/
          COMMIT_MSG="Auto-build: Update STREAM binaries from workflow run ${{ github.run_number }}"
          git commit -m "$COMMIT_MSG"
          echo "Pushing binaries to main branch..."
          git push origin HEAD:main
          echo "Successfully committed and pushed ${total_binaries} binaries to repository"
        else
          echo "No changes detected in bin/ directory, skipping commit"
        fi

        new_tag="v0.0.2-$(date -u +%Y%m%d%H%M%S)"
        git tag "$new_tag"
        git push origin "refs/tags/$new_tag"
'on':
  workflow_dispatch: null
permissions:
  contents: write
